server:
  port: ${DEPLOY_RUN_PORT:8800}
  servlet:
    context-path: /

spring:
  application:
    name: score-api

  # 数据源配置 - MySQL
  datasource:
    url: jdbc:mysql://124.221.197.217:3306/jqcc2?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: jqcc2
    password: 040408
#    password: 313ab0358dd5f293
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # JSON 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# 图片上传配置
app:
  upload:
    path: ${UPLOAD_PATH:D:/jqcc-uploads}
    url-prefix: /uploads

# OpenAPI / Swagger 文档
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志
logging:
  level:
    com.score: debug
    org.hibernate.SQL: debug
